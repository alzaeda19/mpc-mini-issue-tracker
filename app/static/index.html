<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mini Issue Tracker</title><link rel="stylesheet" href="/static/style.css"><script type="module" src="/static/app.js"></script></head>
<body>
<header><div><p class="eyebrow">MPC · ENGINEERING</p><h1>Mini Issue Tracker</h1><p>Keep the work visible. Move issues forward.</p></div><button id="new">New issue</button></header>
<main>
<p id="message" role="status" aria-live="polite"></p>
<section aria-label="Issue filters" class="toolbar"><label>Search title or description<input id="search" type="search" maxlength="200" placeholder="Search issues…"></label><label>Status<select id="filter"><option value="">All statuses</option><option>Open</option><option>In Progress</option><option>Resolved</option><option>Closed</option></select></label><button id="refresh">Refresh</button></section>
<div class="workspace"><section aria-label="Issues"><h2>Issues</h2><div id="issues" aria-live="polite"></div><nav aria-label="Issue pages"><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></nav></section><section id="detail" aria-label="Issue detail"><h2>Select an issue</h2><p>Open an issue to review its details or create a new one.</p></section></div>
</main>
<dialog id="editor"><form id="form"><h2 id="form-title">New issue</h2><label>Title<input name="title" required maxlength="200"></label><label>Description<textarea name="description" required maxlength="10000" rows="5"></textarea></label><label>Status<select name="status"><option>Open</option><option>In Progress</option><option>Resolved</option><option>Closed</option></select></label><label>Priority<select name="priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></label><label>Assignee<select name="assignee_id" required></select></label><p id="form-error" role="alert"></p><div class="actions"><button type="button" id="cancel">Cancel</button><button id="save" type="submit">Save issue</button></div></form></dialog>
</body></html>
